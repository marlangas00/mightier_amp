name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'
      - name: Build iOS without codesign
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r MightierAmp.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MightierAmp-iOS
          path: MightierAmp.ipa
