name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Fix iOS Deployment Target and Build
        run: |
          flutter pub get
          sed -i '' "s/platform :ios, '.*'/platform :ios, '13.0'/g" ios/Podfile || true
          flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r MightierAmp.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MightierAmp-iOS
          path: MightierAmp.ipa
